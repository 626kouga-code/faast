services:
  postgres:
    image: postgres:16
    container_name: trello-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trello_app
      POSTGRES_USER: trello_user
      POSTGRES_PASSWORD: trello_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trello_user -d trello_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
